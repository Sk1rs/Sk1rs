<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220" role="img" aria-label="Sk1rs" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#ffffff" opacity="0.06"/>
    </pattern>
    <radialGradient id="vign" cx="0.5" cy="0.5" r="0.72">
      <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.85"/>
    </radialGradient>
    <clipPath id="sliceA"><rect x="0" y="92" width="900" height="11"/></clipPath>
    <clipPath id="sliceB"><rect x="0" y="103" width="900" height="12"/></clipPath>
    <clipPath id="sliceC"><rect x="0" y="115" width="900" height="12"/></clipPath>
    <clipPath id="box"><rect x="0" y="0" width="900" height="220"/></clipPath>
  </defs>

  <g clip-path="url(#box)">
    <rect width="900" height="220" fill="#08090b"/>

    <!-- обратный треугольник, вращается против часовой -->
    <g transform="translate(450,110)" opacity="0.1">
      <animateTransform attributeName="transform" type="rotate" values="0;-360" dur="64s" repeatCount="indefinite" additive="sum"/>
      <path d="M 0 -86 L 75 44 L -75 44 Z" fill="none" stroke="#ffffff" stroke-width="2"/>
    </g>

    <!-- прямой треугольник, вращается по часовой -->
    <g transform="translate(450,110)" opacity="0.14">
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="41s" repeatCount="indefinite" additive="sum"/>
      <path d="M 0 66 L -58 -34 L 58 -34 Z" fill="none" stroke="#ffffff" stroke-width="2"/>
    </g>

    <!-- кольцо точек -->
    <g transform="translate(450,110)" fill="#ffffff" opacity="0.4">
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="28s" repeatCount="indefinite" additive="sum"/>
      <rect x="-2" y="-100" width="3" height="3"/>
      <rect x="69" y="-71" width="3" height="3"/>
      <rect x="98" y="-2" width="3" height="3"/>
      <rect x="69" y="68" width="3" height="3"/>
      <rect x="-2" y="97" width="3" height="3"/>
      <rect x="-72" y="68" width="3" height="3"/>
      <rect x="-101" y="-2" width="3" height="3"/>
      <rect x="-72" y="-71" width="3" height="3"/>
    </g>

    <!-- кресты по краям -->
    <g fill="#ffffff">
      <g opacity="0.5">
        <animate attributeName="opacity" values="0.5;0.12;0.5" dur="4.4s" repeatCount="indefinite"/>
        <rect x="168" y="86" width="4" height="34"/>
        <rect x="159" y="96" width="22" height="4"/>
      </g>
      <g opacity="0.5">
        <animate attributeName="opacity" values="0.12;0.5;0.12" dur="5.6s" repeatCount="indefinite"/>
        <rect x="728" y="86" width="4" height="34"/>
        <rect x="719" y="96" width="22" height="4"/>
      </g>
    </g>

    <!-- ник -->
    <g font-family="ui-monospace, DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="52" font-weight="700" letter-spacing="14" text-anchor="middle">
      <animate attributeName="opacity" values="1;1;0.55;1;1;0.8;1" keyTimes="0;0.34;0.36;0.38;0.72;0.74;1" dur="6.5s" repeatCount="indefinite"/>

      <text x="450" y="125" fill="#ffffff" opacity="0.22">
        SK1ЯS
        <animateTransform attributeName="transform" type="translate" values="0 0;-9 0;6 0;0 0;0 0;-5 2;0 0"
          keyTimes="0;0.02;0.04;0.06;0.55;0.57;1" dur="6.5s" repeatCount="indefinite"/>
      </text>
      <text x="450" y="125" fill="#8b949e" opacity="0.3">
        SK1ЯS
        <animateTransform attributeName="transform" type="translate" values="0 0;8 0;-7 0;0 0;0 0;4 -2;0 0"
          keyTimes="0;0.02;0.04;0.06;0.55;0.57;1" dur="6.5s" repeatCount="indefinite"/>
      </text>

      <text x="450" y="125" fill="#ffffff">SK1ЯS</text>

      <!-- рваные полосы развёртки -->
      <g clip-path="url(#sliceA)">
        <text x="450" y="125" fill="#ffffff">
          SK1ЯS
          <animateTransform attributeName="transform" type="translate" values="0 0;0 0;-22 0;0 0;0 0;15 0;0 0;0 0"
            keyTimes="0;0.2;0.22;0.24;0.68;0.7;0.72;1" dur="5.1s" calcMode="discrete" repeatCount="indefinite"/>
        </text>
      </g>
      <g clip-path="url(#sliceB)">
        <text x="450" y="125" fill="#ffffff">
          SK1ЯS
          <animateTransform attributeName="transform" type="translate" values="0 0;0 0;17 0;0 0;0 0;-13 0;0 0;0 0"
            keyTimes="0;0.34;0.36;0.38;0.8;0.82;0.84;1" dur="3.7s" calcMode="discrete" repeatCount="indefinite"/>
        </text>
      </g>
      <g clip-path="url(#sliceC)">
        <text x="450" y="125" fill="#ffffff">
          SK1ЯS
          <animateTransform attributeName="transform" type="translate" values="0 0;0 0;-14 0;0 0;0 0;24 0;0 0;0 0"
            keyTimes="0;0.12;0.14;0.16;0.6;0.62;0.64;1" dur="6.2s" calcMode="discrete" repeatCount="indefinite"/>
        </text>
      </g>
    </g>

    <!-- подпись -->
    <text x="450" y="162" fill="#8b949e" text-anchor="middle" font-size="12" letter-spacing="7"
      font-family="ui-monospace, DejaVu Sans Mono, Menlo, Consolas, monospace">
      M O N O C H R O M E
      <animate attributeName="opacity" values="0.75;0.3;0.75" dur="7s" repeatCount="indefinite"/>
    </text>

    <!-- пыль на плёнке -->
    <g fill="#ffffff">
      <rect x="214" y="48" width="3" height="3" opacity="0">
        <animate attributeName="opacity" values="0;0.8;0;0;0" keyTimes="0;0.06;0.12;0.6;1" dur="4.3s" repeatCount="indefinite"/>
      </rect>
      <rect x="640" y="176" width="3" height="3" opacity="0">
        <animate attributeName="opacity" values="0;0;0.7;0;0" keyTimes="0;0.3;0.36;0.42;1" dur="5.8s" repeatCount="indefinite"/>
      </rect>
      <rect x="330" y="190" width="2" height="2" opacity="0">
        <animate attributeName="opacity" values="0;0.6;0;0;0" keyTimes="0;0.5;0.56;0.8;1" dur="3.4s" repeatCount="indefinite"/>
      </rect>
      <rect x="712" y="36" width="2" height="2" opacity="0">
        <animate attributeName="opacity" values="0;0;0.9;0;0" keyTimes="0;0.7;0.74;0.78;1" dur="6.6s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- сбой трекинга -->
    <rect x="0" y="0" width="900" height="16" fill="#ffffff" opacity="0.07">
      <animate attributeName="y" values="-16;236" dur="7.5s" repeatCount="indefinite"/>
    </rect>

    <rect width="900" height="220" fill="url(#scan)"/>
    <rect width="900" height="220" fill="url(#vign)"/>
    <rect x="0.5" y="0.5" width="899" height="219" fill="none" stroke="#1c2128" stroke-width="1"/>
  </g>
</svg>
