<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200" role="img" aria-label="Sk1rs" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0 L0 0 0 30" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.05"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d1117" stop-opacity="1"/>
      <stop offset="50%" stop-color="#0d1117" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="1"/>
    </linearGradient>
    <clipPath id="frame">
      <rect x="0" y="0" width="900" height="200"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="900" height="200" fill="#0d1117"/>
    <rect width="900" height="200" fill="url(#grid)"/>

    <!-- пиксельные точки, мерцают по очереди -->
    <g fill="#ffffff">
      <rect x="60" y="40" width="4" height="4" opacity="0.2">
        <animate attributeName="opacity" values="0.1;0.8;0.1" dur="3s" begin="0s" repeatCount="indefinite"/>
      </rect>
      <rect x="150" y="160" width="4" height="4" opacity="0.2">
        <animate attributeName="opacity" values="0.1;0.7;0.1" dur="4s" begin="0.6s" repeatCount="indefinite"/>
      </rect>
      <rect x="810" y="55" width="4" height="4" opacity="0.2">
        <animate attributeName="opacity" values="0.1;0.9;0.1" dur="2.6s" begin="1.2s" repeatCount="indefinite"/>
      </rect>
      <rect x="740" y="165" width="4" height="4" opacity="0.2">
        <animate attributeName="opacity" values="0.1;0.6;0.1" dur="3.4s" begin="0.3s" repeatCount="indefinite"/>
      </rect>
      <rect x="440" y="28" width="4" height="4" opacity="0.2">
        <animate attributeName="opacity" values="0.1;0.7;0.1" dur="5s" begin="2s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- имя: три слоя со сдвигом = глитч -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="86" font-weight="700" letter-spacing="14" text-anchor="middle">
      <text x="450" y="106" fill="#ffffff" opacity="0.25">
        SK1RS
        <animateTransform attributeName="transform" type="translate"
          values="0 0; -6 0; 4 0; 0 0; 0 0; -3 0; 0 0"
          keyTimes="0; 0.03; 0.06; 0.09; 0.6; 0.63; 1"
          dur="5s" repeatCount="indefinite"/>
      </text>
      <text x="450" y="106" fill="#8b949e" opacity="0.35">
        SK1RS
        <animateTransform attributeName="transform" type="translate"
          values="0 0; 5 0; -4 0; 0 0; 0 0; 3 0; 0 0"
          keyTimes="0; 0.03; 0.06; 0.09; 0.6; 0.63; 1"
          dur="5s" repeatCount="indefinite"/>
      </text>
      <text x="450" y="106" fill="#ffffff">
        SK1RS
        <animate attributeName="opacity" values="1;1;0.75;1;1" keyTimes="0;0.58;0.61;0.64;1" dur="5s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- подпись + курсор -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="5" text-anchor="middle">
      <text x="444" y="140" fill="#8b949e">M O N O C H R O M E</text>
    </g>
    <rect x="524" y="129" width="9" height="14" fill="#8b949e">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.51;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>

    <!-- эквалайзер -->
    <g fill="#ffffff" opacity="0.55">
      <rect x="386" y="164" width="6" height="12">
        <animate attributeName="height" values="12;28;6;20;12" dur="1.6s" repeatCount="indefinite"/>
        <animate attributeName="y" values="164;148;170;156;164" dur="1.6s" repeatCount="indefinite"/>
      </rect>
      <rect x="400" y="164" width="6" height="20">
        <animate attributeName="height" values="20;6;26;10;20" dur="1.9s" repeatCount="indefinite"/>
        <animate attributeName="y" values="156;170;150;166;156" dur="1.9s" repeatCount="indefinite"/>
      </rect>
      <rect x="414" y="164" width="6" height="8">
        <animate attributeName="height" values="8;24;14;30;8" dur="1.3s" repeatCount="indefinite"/>
        <animate attributeName="y" values="168;152;162;146;168" dur="1.3s" repeatCount="indefinite"/>
      </rect>
      <rect x="428" y="164" width="6" height="26">
        <animate attributeName="height" values="26;10;22;6;26" dur="2.1s" repeatCount="indefinite"/>
        <animate attributeName="y" values="150;166;154;170;150" dur="2.1s" repeatCount="indefinite"/>
      </rect>
      <rect x="442" y="164" width="6" height="14">
        <animate attributeName="height" values="14;30;8;24;14" dur="1.7s" repeatCount="indefinite"/>
        <animate attributeName="y" values="162;146;168;152;162" dur="1.7s" repeatCount="indefinite"/>
      </rect>
      <rect x="456" y="164" width="6" height="22">
        <animate attributeName="height" values="22;8;28;12;22" dur="1.45s" repeatCount="indefinite"/>
        <animate attributeName="y" values="154;168;148;164;154" dur="1.45s" repeatCount="indefinite"/>
      </rect>
      <rect x="470" y="164" width="6" height="10">
        <animate attributeName="height" values="10;26;16;6;10" dur="2.3s" repeatCount="indefinite"/>
        <animate attributeName="y" values="166;150;160;170;166" dur="2.3s" repeatCount="indefinite"/>
      </rect>
      <rect x="484" y="164" width="6" height="18">
        <animate attributeName="height" values="18;6;24;14;18" dur="1.75s" repeatCount="indefinite"/>
        <animate attributeName="y" values="158;170;152;162;158" dur="1.75s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- бегущая строка развёртки -->
    <rect x="0" y="-40" width="900" height="40" fill="#ffffff" opacity="0.05">
      <animate attributeName="y" values="-40;200" dur="5.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="0" y="0" width="900" height="2" fill="#ffffff" opacity="0.18">
      <animate attributeName="y" values="-2;200" dur="5.5s" repeatCount="indefinite"/>
    </rect>

    <!-- рамка -->
    <rect x="0.5" y="0.5" width="899" height="199" fill="none" stroke="#30363d" stroke-width="1"/>
    <rect width="900" height="200" fill="url(#fade)" opacity="0.35"/>
  </g>
</svg>
