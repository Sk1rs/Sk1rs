<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 160" width="900" height="160" role="img" aria-label="drifting station" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="floor" width="16" height="4" patternUnits="userSpaceOnUse">
      <rect width="9" height="2" fill="#ffffff" opacity="0.16"/>
    </pattern>
    <linearGradient id="edges" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d1117" stop-opacity="1"/>
      <stop offset="12%" stop-color="#0d1117" stop-opacity="0"/>
      <stop offset="88%" stop-color="#0d1117" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="1"/>
    </linearGradient>
    <clipPath id="box">
      <rect x="0" y="0" width="900" height="160"/>
    </clipPath>
  </defs>

  <g clip-path="url(#box)">
    <rect width="900" height="160" fill="#0d1117"/>

    <!-- дальние звёзды, медленный слой -->
    <g opacity="0.35">
      <animateTransform attributeName="transform" type="translate" values="0 0; -900 0" dur="46s" repeatCount="indefinite"/>
      <g fill="#ffffff">
        <rect x="40" y="26" width="2" height="2"/><rect x="128" y="74" width="2" height="2"/>
        <rect x="205" y="18" width="2" height="2"/><rect x="286" y="92" width="2" height="2"/>
        <rect x="350" y="46" width="2" height="2"/><rect x="431" y="30" width="2" height="2"/>
        <rect x="505" y="84" width="2" height="2"/><rect x="590" y="22" width="2" height="2"/>
        <rect x="664" y="60" width="2" height="2"/><rect x="745" y="38" width="2" height="2"/>
        <rect x="828" y="80" width="2" height="2"/>
        <rect x="940" y="26" width="2" height="2"/><rect x="1028" y="74" width="2" height="2"/>
        <rect x="1105" y="18" width="2" height="2"/><rect x="1186" y="92" width="2" height="2"/>
        <rect x="1250" y="46" width="2" height="2"/><rect x="1331" y="30" width="2" height="2"/>
        <rect x="1405" y="84" width="2" height="2"/><rect x="1490" y="22" width="2" height="2"/>
        <rect x="1564" y="60" width="2" height="2"/><rect x="1645" y="38" width="2" height="2"/>
        <rect x="1728" y="80" width="2" height="2"/>
      </g>
    </g>

    <!-- ближние звёзды, быстрый слой -->
    <g opacity="0.7">
      <animateTransform attributeName="transform" type="translate" values="0 0; -900 0" dur="21s" repeatCount="indefinite"/>
      <g fill="#ffffff">
        <rect x="70" y="52" width="3" height="3"/><rect x="238" y="34" width="3" height="3"/>
        <rect x="392" y="88" width="3" height="3"/><rect x="548" y="44" width="3" height="3"/>
        <rect x="700" y="96" width="3" height="3"/><rect x="860" y="30" width="3" height="3"/>
        <rect x="970" y="52" width="3" height="3"/><rect x="1138" y="34" width="3" height="3"/>
        <rect x="1292" y="88" width="3" height="3"/><rect x="1448" y="44" width="3" height="3"/>
        <rect x="1600" y="96" width="3" height="3"/><rect x="1760" y="30" width="3" height="3"/>
      </g>
    </g>

    <!-- станция, дрейфует -->
    <g transform="translate(690, 14)">
      <animateTransform attributeName="transform" type="translate" values="690 14; 690 6; 690 14" dur="11s" repeatCount="indefinite" additive="sum"/>

      <!-- солнечные панели -->
      <g fill="#161b22" stroke="#30363d" stroke-width="2">
        <rect x="-16" y="28" width="40" height="18"/>
        <rect x="150" y="28" width="40" height="18"/>
      </g>
      <g stroke="#30363d" stroke-width="2">
        <line x1="24" y1="37" x2="48" y2="37"/>
        <line x1="126" y1="37" x2="150" y2="37"/>
        <line x1="-16" y1="37" x2="24" y2="37" opacity="0"/>
      </g>

      <!-- корпус -->
      <rect x="48" y="16" width="78" height="42" fill="#161b22" stroke="#30363d" stroke-width="2"/>
      <rect x="66" y="4" width="42" height="14" fill="#161b22" stroke="#30363d" stroke-width="2"/>
      <rect x="66" y="56" width="42" height="14" fill="#161b22" stroke="#30363d" stroke-width="2"/>

      <!-- иллюминаторы -->
      <g fill="#ffffff">
        <rect x="58" y="26" width="6" height="6" opacity="0.8">
          <animate attributeName="opacity" values="0.8;0.2;0.8" dur="3.2s" repeatCount="indefinite"/>
        </rect>
        <rect x="72" y="26" width="6" height="6" opacity="0.5">
          <animate attributeName="opacity" values="0.5;0.9;0.5" dur="4.1s" begin="0.7s" repeatCount="indefinite"/>
        </rect>
        <rect x="86" y="26" width="6" height="6" opacity="0.7">
          <animate attributeName="opacity" values="0.7;0.15;0.7" dur="2.6s" begin="1.4s" repeatCount="indefinite"/>
        </rect>
        <rect x="100" y="26" width="6" height="6" opacity="0.4">
          <animate attributeName="opacity" values="0.4;0.85;0.4" dur="5s" begin="0.3s" repeatCount="indefinite"/>
        </rect>
        <rect x="58" y="42" width="6" height="6" opacity="0.6">
          <animate attributeName="opacity" values="0.6;0.1;0.6" dur="3.8s" begin="2.1s" repeatCount="indefinite"/>
        </rect>
        <rect x="100" y="42" width="6" height="6" opacity="0.3">
          <animate attributeName="opacity" values="0.3;0.8;0.3" dur="4.6s" begin="1.1s" repeatCount="indefinite"/>
        </rect>
      </g>

      <!-- маячок -->
      <rect x="84" y="-4" width="6" height="6" fill="#ffffff">
        <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.12;0.13;1" dur="1.8s" repeatCount="indefinite"/>
      </rect>
      <line x1="87" y1="2" x2="87" y2="4" stroke="#30363d" stroke-width="2"/>
    </g>

    <!-- пол -->
    <rect x="0" y="128" width="900" height="2" fill="url(#floor)"/>

    <!-- персонаж: идёт слева направо, 4 кадра ходьбы -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="-80 0; 960 0" dur="26s" repeatCount="indefinite"/>
      <g transform="translate(0,80) scale(4)" fill="#ffffff">

        <!-- корпус, общий для всех кадров -->
        <rect x="3" y="-1" width="1" height="1"/>
        <rect x="2" y="0" width="4" height="4"/>
        <rect x="3" y="1" width="3" height="2" fill="#0d1117"/>
        <rect x="0" y="4" width="1" height="3"/>
        <rect x="2" y="4" width="4" height="4"/>

        <!-- кадр 0 -->
        <g>
          <animate attributeName="opacity" values="1;0;0;0" keyTimes="0;0.25;0.5;0.75" dur="0.64s" calcMode="discrete" repeatCount="indefinite"/>
          <rect x="1" y="8" width="2" height="3"/><rect x="0" y="11" width="2" height="1"/>
          <rect x="5" y="8" width="2" height="3"/><rect x="6" y="11" width="2" height="1"/>
          <rect x="6" y="5" width="1" height="3"/>
          <rect x="1" y="5" width="1" height="2"/>
        </g>

        <!-- кадр 1 -->
        <g>
          <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.25;0.5;0.75" dur="0.64s" calcMode="discrete" repeatCount="indefinite"/>
          <rect x="2" y="8" width="2" height="3"/><rect x="2" y="11" width="2" height="1"/>
          <rect x="4" y="8" width="2" height="3"/><rect x="4" y="11" width="2" height="1"/>
          <rect x="6" y="5" width="1" height="2"/>
          <rect x="1" y="5" width="1" height="2"/>
        </g>

        <!-- кадр 2 -->
        <g>
          <animate attributeName="opacity" values="0;0;1;0" keyTimes="0;0.25;0.5;0.75" dur="0.64s" calcMode="discrete" repeatCount="indefinite"/>
          <rect x="1" y="8" width="2" height="3"/><rect x="0" y="11" width="2" height="1"/>
          <rect x="5" y="8" width="2" height="3"/><rect x="6" y="11" width="2" height="1"/>
          <rect x="6" y="5" width="1" height="2"/>
          <rect x="1" y="5" width="1" height="3"/>
        </g>

        <!-- кадр 3 -->
        <g>
          <animate attributeName="opacity" values="0;0;0;1" keyTimes="0;0.25;0.5;0.75" dur="0.64s" calcMode="discrete" repeatCount="indefinite"/>
          <rect x="2" y="8" width="2" height="3"/><rect x="2" y="11" width="2" height="1"/>
          <rect x="4" y="8" width="2" height="3"/><rect x="4" y="11" width="2" height="1"/>
          <rect x="6" y="5" width="1" height="2"/>
          <rect x="1" y="5" width="1" height="2"/>
        </g>
      </g>
    </g>

    <rect width="900" height="160" fill="url(#edges)"/>
  </g>
</svg>
